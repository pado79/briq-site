name: check-site

# The legal pages here have to say exactly what the Bríq app says. This runs
# tools/check-site.py on every change to main so a drift cannot be published
# unnoticed. It only reads the checkout: nothing is deployed from here, because
# the site is published by GitHub Pages from the main branch itself.
#
# ⚠️ THE RUN PASSES --app, SO THE APP COMPARISON ACTUALLY HAPPENS IN CI. Without
# it the checker skips the controller, the address, the contact addresses, the
# privacy date, the data categories and the purposes, and prints a line on stderr
# saying so — a green tick that proves far less than it looks like it does. Five
# real app/site disagreements were sitting in published legal text on 24 November
# 2026 while this workflow passed, because it ran without --app.
#
# ⚠️ --app POINTS AT A VENDORED EXTRACT, NOT AT THE APP REPOSITORY, AND THAT IS
# FORCED RATHER THAN CHOSEN. The app repository is PRIVATE and this one is
# PUBLIC, so actions/checkout here cannot fetch it: the default GITHUB_TOKEN is
# scoped to this repository alone, and a token that could reach the app would be
# a cross-repository credential living in a public repo's CI. vendor/app-legal.json
# is a committed extract of the app's legal text, generated by the checker's own
# read_app so the producer and the consumer cannot disagree.
#
# ⚠️ WHAT THIS WORKFLOW CANNOT CATCH IS A STALE EXTRACT. It proves the site
# agrees with vendor/app-legal.json; it cannot prove that file still agrees with
# the app, because it cannot see the app. That check lives in the app repository,
# which is the only side with both in front of it. If the app's legal text
# changes, the app's own suite fails until the extract is regenerated here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1, pinned to its commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Show the Python the runner provides
        run: python3 --version

      - name: Confirm the vendored app extract is present
        # A missing or unreadable extract makes check-site.py exit 2 rather than
        # pass, but failing here says why in one line instead of a parse error.
        run: test -f vendor/app-legal.json

      - name: Run the site checks against the app's legal text
        run: python3 tools/check-site.py --app vendor/app-legal.json
